<svg xmlns="http://www.w3.org/2000/svg" width="104" height="184" viewBox="0 0 104 184">
  <!-- Волшебник — анимация каста -->
  <rect x="20" y="44" width="64" height="8" rx="2" fill="#1a0a3a"/>
  <rect x="34" y="16" width="36" height="30" rx="3" fill="#2a0e5a"/>
  <polygon points="52,4 34,18 70,18" fill="#2a0e5a"/>
  <polygon points="52,8 54,12 58,12 55,14 56,18 52,16 48,18 49,14 46,12 50,12" fill="#f0c040"/>
  <!-- Голова -->
  <rect x="32" y="52" width="44" height="40" rx="6" fill="#f0c090"/>
  <!-- Глаза светятся при касте -->
  <rect x="38" y="62" width="8" height="8" rx="2" fill="#88aaff"/>
  <rect x="60" y="62" width="8" height="8" rx="2" fill="#88aaff"/>
  <rect x="40" y="63" width="5" height="6" rx="1" fill="#4466ff"/>
  <rect x="62" y="63" width="5" height="6" rx="1" fill="#4466ff"/>
  <rect x="41" y="64" width="2" height="2" fill="#fff"/>
  <rect x="63" y="64" width="2" height="2" fill="#fff"/>
  <rect x="38" y="84" width="28" height="10" rx="4" fill="#ccc"/>
  <!-- Мантия -->
  <rect x="18" y="92" width="68" height="64" rx="6" fill="#3a1a6a"/>
  <rect x="36" y="88" width="32" height="16" rx="4" fill="#4a2a8a"/>
  <polygon points="38,110 40,116 46,116 41,119 43,125 38,122 33,125 35,119 30,116 36,116" fill="#f0c040" opacity="0.6"/>
  <rect x="18" y="136" width="68" height="8" rx="2" fill="#1a0a3a"/>
  <rect x="46" y="134" width="12" height="12" rx="2" fill="#f0c040"/>
  <rect x="22" y="144" width="60" height="32" rx="4" fill="#3a1a6a"/>
  <rect x="26" y="172" width="22" height="12" rx="4" fill="#1a0a3a"/>
  <rect x="56" y="172" width="22" height="12" rx="4" fill="#1a0a3a"/>
  <!-- Левая рука поднята для каста -->
  <g transform="rotate(-30,9,91)">
    <rect x="0" y="70" width="18" height="42" rx="6" fill="#3a1a6a"/>
    <rect x="-2" y="62" width="8" height="60" rx="3" fill="#7a4a1a"/>
  </g>
  <!-- Орб при касте -->
  <circle cx="-8" cy="58" r="12" fill="#8050e0" opacity="0.9"/>
  <circle cx="-8" cy="58" r="7" fill="#b090ff"/>
  <circle cx="-11" cy="55" r="3" fill="#fff" opacity="0.8"/>
