  <circle cx="10" cy="34" r="3" fill="#ffe060"/>
  <circle cx="20" cy="22" r="2" fill="#80c0ff"/>
  <circle cx="2" cy="20" r="2" fill="#ff80c0"/>
  <circle cx="16" cy="10" r="4" fill="#fff" opacity="0.7"/>
  <!-- Правая рука -->
  <rect x="86" y="100" width="18" height="40" rx="6" fill="#3a1a6a"/>
  <ellipse cx="96" cy="142" rx="8" ry="6" fill="#f0c090"/>
